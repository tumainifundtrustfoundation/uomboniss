<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 220" width="512" height="512">
  <defs>
    <!-- Radiant Gold Gradients -->
    <linearGradient id="pwaGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="30%" stop-color="#FDE047" />
      <stop offset="70%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <linearGradient id="pwaGoldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF9C3" />
      <stop offset="50%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Sky Gradient -->
    <linearGradient id="pwaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD" />
      <stop offset="50%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <!-- Vibrant Royal Blue (Never Black/Dark) -->
    <linearGradient id="pwaBlueShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Vibrant Royal Blue Banner for High Text Contrast -->
    <linearGradient id="pwaBlueBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Clip Path -->
    <clipPath id="pwaCenterClip">
      <circle cx="110" cy="102" r="54" />
    </clipPath>

    <!-- Text Paths -->
    <path id="pwa-top-diocese-path" d="M 28,104 A 82,82 0 1,1 192,104" fill="none" />
    <path id="pwa-bottom-motto-path" d="M 38,144 C 70,172 150,172 182,144" fill="none" />
  </defs>

  <!-- 1. TOP ROYAL BLUE CURVED BANNER: CATHOLIC DIOCESE OF MOSHI -->
  <path
    d="M 26 95 C 26 32, 194 32, 194 95 L 174 95 C 174 48, 46 48, 46 95 Z"
    fill="url(#pwaBlueBanner)"
    stroke="url(#pwaGold)"
    stroke-width="2.5"
  />
  <text font-size="11" font-weight="900" font-family="Arial, sans-serif" fill="#FFFFFF" letter-spacing="1">
    <textPath href="#pwa-top-diocese-path" startOffset="50%" text-anchor="middle">
      CATHOLIC DIOCESE OF MOSHI
    </textPath>
  </text>

  <!-- 2. MAIN BLUE CIRCLE FRAME -->
  <circle
    cx="110"
    cy="102"
    r="60"
    fill="url(#pwaBlueShield)"
    stroke="url(#pwaGold)"
    stroke-width="4"
  />

  <!-- 3. INNER CENTRAL DISC -->
  <g clip-path="url(#pwaCenterClip)">
    <!-- Sky Background -->
    <rect x="45" y="40" width="130" height="130" fill="url(#pwaSky)" />

    <!-- Mount Kilimanjaro (Lush Green with Snowcap) -->
    <polygon points="52,108 88,68 126,108" fill="#16A34A" stroke="#15803D" stroke-width="0.8" />
    <polygon points="105,108 135,74 165,108" fill="#15803D" />
    <!-- Snowy Kibo Peak -->
    <polygon points="76,82 88,68 100,82 94,86 88,83 82,86" fill="#FFFFFF" stroke="#BAE6FD" stroke-width="0.5" />

    <!-- Holy Red Catholic Cross -->
    <rect x="103" y="46" width="14" height="72" fill="#DC2626" />
    <rect x="105" y="48" width="10" height="68" fill="#EF4444" />
    <rect x="74" y="66" width="72" height="13" fill="#DC2626" />
    <rect x="76" y="68" width="68" height="9" fill="#EF4444" />

    <!-- ICT Computer Workstation & Monitor (Top Right) -->
    <g transform="translate(124, 52)">
      <rect x="0" y="0" width="22" height="16" rx="2" fill="#1E293B" stroke="#FFFFFF" stroke-width="1.2" />
      <rect x="2" y="2" width="18" height="12" rx="1" fill="#38BDF8" />
      <line x1="4" y1="5" x2="12" y2="5" stroke="#FFFFFF" stroke-width="1" />
      <line x1="4" y1="8" x2="16" y2="8" stroke="#FDE047" stroke-width="1" />
      <line x1="4" y1="11" x2="10" y2="11" stroke="#FFFFFF" stroke-width="1" />
      <rect x="9" y="16" width="4" height="4" fill="#94A3B8" />
      <rect x="6" y="19" width="10" height="2" rx="0.5" fill="#475569" />
      <rect x="2" y="22" width="18" height="3" rx="0.5" fill="#F1F5F9" stroke="#94A3B8" stroke-width="0.5" />
    </g>

    <!-- Students with Graduation Caps -->
    <!-- Left Student: Boy Graduate -->
    <g transform="translate(72, 94)">
      <circle cx="18" cy="18" r="10" fill="#FDE68A" stroke="#1E293B" stroke-width="0.8" />
      <path d="M 9 16 C 9 11, 27 11, 27 16 Z" fill="#1D4ED8" />
      <polygon points="18,4 30,9 18,14 6,9" fill="#1D4ED8" stroke="#F59E0B" stroke-width="0.8" />
      <rect x="12" y="9" width="12" height="3.5" fill="#1D4ED8" />
      <line x1="18" y1="9" x2="28" y2="15" stroke="#F59E0B" stroke-width="1.2" />
      <path d="M 5 28 C 5 22, 31 22, 31 28 L 36 42 L 0 42 Z" fill="#1D4ED8" />
      <polygon points="18,27 13,24 15,22 18,25 21,22 23,24" fill="#FFFFFF" />
      <polygon points="18,25 16,33 18,35 20,33" fill="#DC2626" />
    </g>

    <!-- Right Student: Girl Graduate -->
    <g transform="translate(112, 94)">
      <circle cx="18" cy="18" r="10" fill="#FDE68A" stroke="#1E293B" stroke-width="0.8" />
      <path d="M 8 16 C 8 8, 28 8, 28 16 L 29 23 L 26 23 L 26 18 C 26 13, 10 13, 10 18 L 10 23 L 7 23 Z" fill="#1D4ED8" />
      <polygon points="18,4 30,9 18,14 6,9" fill="#1D4ED8" stroke="#F59E0B" stroke-width="0.8" />
      <rect x="12" y="9" width="12" height="3.5" fill="#1D4ED8" />
      <line x1="18" y1="9" x2="28" y2="15" stroke="#F59E0B" stroke-width="1.2" />
      <path d="M 5 28 C 5 22, 31 22, 31 28 L 36 42 L 0 42 Z" fill="#1D4ED8" />
      <polygon points="18,27 13,24 15,22 18,25 21,22 23,24" fill="#FFFFFF" />
      <circle cx="18" cy="27" r="2" fill="#DC2626" />
    </g>
  </g>

  <!-- 4. UPPER INNER BLUE ARC: UOMBONI -->
  <path
    d="M 52 68 C 78 48, 142 48, 168 68 L 160 80 C 138 64, 82 64, 60 80 Z"
    fill="#1D4ED8"
    stroke="#FBBF24"
    stroke-width="1.8"
  />
  <text
    x="110"
    y="70"
    font-size="13.5"
    font-weight="900"
    font-family="Arial, sans-serif"
    fill="#FFFFFF"
    text-anchor="middle"
    letter-spacing="2.5"
  >
    UOMBONI
  </text>

  <!-- 5. LOWER INNER BLUE ARC: SECONDARY SCHOOL -->
  <path
    d="M 50 134 C 78 158, 142 158, 170 134 L 163 123 C 138 144, 82 144, 57 123 Z"
    fill="#1D4ED8"
    stroke="#FBBF24"
    stroke-width="1.8"
  />
  <text
    x="110"
    y="142"
    font-size="10.5"
    font-weight="900"
    font-family="Arial, sans-serif"
    fill="#FEF08A"
    text-anchor="middle"
    letter-spacing="1.5"
  >
    SECONDARY SCHOOL
  </text>

  <!-- 6. BOTTOM ROYAL BLUE CURVED BANNER: TUJIENDELEZE SISI WENYEWE -->
  <path
    d="M 22 150 C 58 184, 162 184, 198 150 L 188 137 C 156 168, 64 168, 32 137 Z"
    fill="url(#pwaBlueBanner)"
    stroke="url(#pwaGold)"
    stroke-width="2.5"
  />
  <text font-size="10" font-weight="900" font-family="Arial, sans-serif" fill="#FEF08A" letter-spacing="0.8">
    <textPath href="#pwa-bottom-motto-path" startOffset="50%" text-anchor="middle">
      TUJIENDELEZE SISI WENYEWE
    </textPath>
  </text>

  <!-- 7. BOTTOM PEDESTAL RIBBON: PRAYER • EDUCATION • WORK -->
  <g transform="translate(18, 176)">
    <path d="M 0 4 L 48 4 L 44 20 L 0 20 L 6 12 Z" fill="url(#pwaBlueBanner)" stroke="url(#pwaGold)" stroke-width="1.8" />
    <text x="24" y="15" font-size="9" font-weight="900" font-family="Arial, sans-serif" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      PRAYER
    </text>
  </g>

  <g transform="translate(70, 172)">
    <rect x="0" y="0" width="80" height="22" rx="4" fill="url(#pwaBlueBanner)" stroke="url(#pwaGold)" stroke-width="2" />
    <text x="40" y="15" font-size="11" font-weight="900" font-family="Arial, sans-serif" fill="#FEF08A" text-anchor="middle" letter-spacing="1.2">
      EDUCATION
    </text>
  </g>

  <g transform="translate(154, 176)">
    <path d="M 0 4 L 48 4 L 42 12 L 48 20 L 0 20 Z" fill="url(#pwaBlueBanner)" stroke="url(#pwaGold)" stroke-width="1.8" />
    <text x="24" y="15" font-size="9" font-weight="900" font-family="Arial, sans-serif" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">
      WORK
    </text>
  </g>
</svg>
