    <!-- Loading Screen Lifecycle Controller -->
    <script>
      (function() {
        var loader = document.getElementById('uomboni-loading-screen');
        if (!loader) return;

        var progressBar = document.getElementById('uomboni-loader-progress-bar');
        var timerText = document.getElementById('uomboni-loader-timer-text');
        var percentText = document.getElementById('uomboni-loader-percent-text');
        var skipBtn = document.getElementById('uomboni-loader-skip-btn');

        // Rapid smooth entrance: 1.5s in standalone, 600ms in preview iframe
        var isIframe = window.self !== window.top;
        var TOTAL_DURATION_MS = isIframe ? 600 : 1500;
        var startTime = Date.now();
        var isDismissed = false;
        var intervalId = null;

        document.documentElement.classList.add('uomboni-loader-locked');
        document.body.classList.add('uomboni-loader-locked');

        function forceDismiss() {
          if (isDismissed) return;
          isDismissed = true;
          if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
          }

          if (progressBar) progressBar.style.width = '100%';
          if (percentText) percentText.textContent = '100%';
          if (timerText) timerText.textContent = 'Karibu Uomboni!';

          loader.classList.add('uomboni-loader-fade-out');
          document.documentElement.classList.remove('uomboni-loader-locked');
          document.body.classList.remove('uomboni-loader-locked');

          setTimeout(function() {
            if (loader && loader.parentNode) {
              loader.parentNode.removeChild(loader);
            }
          }, 400);
        }

        // Tap/click to dismiss instantly
        loader.addEventListener('click', forceDismiss);
        if (skipBtn) {
          skipBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            forceDismiss();
          });
        }

        function updateProgress() {
          if (isDismissed) return;
          var elapsed = Date.now() - startTime;
          var progress = Math.min(1, elapsed / TOTAL_DURATION_MS);
          var percent = Math.floor(progress * 100);

          if (progressBar) {
            progressBar.style.width = percent + '%';
          }
          if (percentText) {
            percentText.textContent = percent + '%';
          }
          if (timerText) {
            timerText.textContent = percent >= 100 ? 'Karibu Uomboni!' : 'Inapakia... ' + percent + '%';
          }

          if (elapsed >= TOTAL_DURATION_MS) {
            forceDismiss();
          }
        }

        intervalId = setInterval(updateProgress, 40);
        updateProgress();

        // Global dismiss functions
        window.uomboniDismissLoader = forceDismiss;
        window.uomboniForceDismissLoader = forceDismiss;

        // Guaranteed safety timeout: dismiss at 2s max
        setTimeout(forceDismiss, isIframe ? 1000 : 2000);
      })();
    </script>

                console.info('Service Worker registration skipped:', err ? err.message : err);
              });
          });
        }
      } catch (err) {

      }
    </script>
